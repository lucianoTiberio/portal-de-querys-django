<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bloco para o título da aba mudar dinamicamente -->
    <title>{% block title %}Painel de Extração de Querys{% endblock %}</title>

    <!-- Importando o CSS do Bootstrap via internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <!-- TELA DE CARREGAMENTO (Escondida por padrão) -->
    <div id="tela-carregamento" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white;">
        <!-- Aquela bolinha girando do Bootstrap -->
        <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status"></div>
        <h3 class="mt-4">Processando Relatório...</h3>
        <p class="text-muted">Isso pode levar alguns segundos. Por favor, aguarde.</p>
    </div>

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="{% url 'painel_relatorios' %}">Painel de Extração de Querys</a>

            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Olá, <strong>{{ user.username }}</strong></span>

                    <!-- Botão de Sair -->
                    <form method="POST" action="{% url 'logout' %}" style="margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger">Sair</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- ÁREA ONDE AS OUTRAS PÁGINAS VÃO ENTRAR -->
    <div class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="mt-auto py-3 bg-dark text-center text-white">
        <div class="container">
            <small>
                <!-- A tag 'now' do Django pega o ano atual automaticamente -->
                &copy; {% now "Y" %} - Desenvolvido por
                <a href="https://www.linkedin.com/in/luciano-tiberio-532972a4/" target="_blank" class="text-info text-decoration-none fw-bold">
                    Luciano Tiberio
                </a>
            </small>
        </div>
    </footer>

<!-- SCRIPT PARA CONTROLAR A TELA DE CARREGAMENTO -->
    <script>
        function mostrarCarregamento() {
            // 1. Mostra a tela escura
            document.getElementById('tela-carregamento').style.display = 'flex';

            // 2. Fica checando a cada 1 segundo se o Python mandou o "bilhete" (cookie)
            let verificador = setInterval(function() {
                if (document.cookie.indexOf("download_pronto=sim") !== -1) {
                    // O Python mandou o arquivo! Esconde a tela.
                    document.getElementById('tela-carregamento').style.display = 'none';

                    // Apaga o cookie para que os próximos downloads funcionem
                    document.cookie = "download_pronto=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

                    // Para o cronômetro
                    clearInterval(verificador);
                }
            }, 1000);
        }
    </script>

</body>
</html>
